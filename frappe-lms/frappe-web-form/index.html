<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Slidev Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Slidev Presentation Generator</h1>
        <div class="input-area">
            <label for="prompt">Enter your presentation prompt:</label>
            <input type="text" id="prompt" placeholder="Type your prompt here...">
            <button id="generate-slides">Generate Slides</button>
        </div>
        <div class="output-area">
            <h2>Generated Slides Preview</h2>
            <div id="slides-preview"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
